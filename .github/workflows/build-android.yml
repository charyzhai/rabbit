name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 安装 pnpm（版本与 package.json 的 packageManager 字段一致）
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'   # 项目用 pnpm，必须对应 pnpm-lock.yaml（不能用 npm）

      - name: Install dependencies
        run: pnpm install --frozen-lockfile   # 用 pnpm 安装，与 pnpm-lock.yaml 严格一致

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: |
          eas build --platform android \
            --profile preview \
            --non-interactive \
            --no-wait
